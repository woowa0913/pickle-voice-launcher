name: Build Pickle Voice APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pickle-voice-launcher-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Pickle Voice v1.0.0 (APK)"
        body: |
          ## 🥒 피클 보이스 (Pickle Voice Launcher) APK
          - 스마트폰 화면이 꺼져 있어도 즉시 피클 실시간 음성 통화(`pickle://call`)로 직행하는 초경량 런처
          - 설치 후 측면 버튼 두 번 누르기나 빅스비 루틴에 등록해 사용하세요!
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
